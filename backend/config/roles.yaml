# RBAC Configuration
# Defines roles, permissions, and resource access control

roles:
  superadmin:
    name: "Super Administrator"
    description: "Complete system access - Shannon only"
    permissions:
      # Core system permissions - EVERYTHING
      users: ["*"]
      campuses: ["*"]
      system: ["*"]
      settings: ["*"]
      
      # New resources - FULL ACCESS
      devotions_admin: ["*"]
      groups: ["*"]
      beacons: ["*"]
      resources: ["*"]
      
      # Existing resources - FULL ACCESS
      serving: ["*"]
      communications: ["*"]
      prayer_requests: ["*"]
      events: ["*"]
      finance: ["*"]
      heartbeat: ["*"]
      passport: ["*"]

  admin:
    name: "Administrator"
    description: "Administrative access to core features and management"
    permissions:
      # Core system permissions - User/Campus/Resource management
      users: ["view", "edit", "create", "delete"]
      campuses: ["view", "edit", "create", "delete"]
      system: ["view", "edit"]
      settings: ["view", "edit"]
      
      # New resources
      devotions_admin: ["view", "edit", "publish"]
      groups: ["view", "edit", "create"]
      beacons: ["view", "edit", "create", "delete"]
      resources: ["view", "edit", "create", "delete"]
      
      # Existing resources
      serving: ["view", "edit", "create"]
      communications: ["view", "edit", "create"]
      prayer_requests: ["view", "edit"]
      events: ["view", "edit", "create", "delete"]
      finance: ["view", "edit", "create"]
      heartbeat: ["view", "edit"]
      passport: ["view", "edit"]

  senior_leadership:
    name: "Senior Leadership"
    description: "Church leadership with full access (same as admin)"
    permissions:
      # Core system permissions - FULL ACCESS
      users: ["*"]
      campuses: ["*"]
      system: ["*"]
      settings: ["*"]
      
      # New resources - FULL ACCESS
      devotions_admin: ["*"]
      groups: ["*"]
      beacons: ["*"]
      resources: ["*"]
      
      # Existing resources - FULL ACCESS
      serving: ["*"]
      communications: ["*"]
      prayer_requests: ["*"]
      events: ["*"]
      finance: ["*"]
      heartbeat: ["*"]
      passport: ["*"]

  senior_pastor:
    name: "Senior Pastor"
    description: "Senior Pastor with full access to everything"
    permissions:
      users: ["*"]
      campuses: ["*"]
      system: ["*"]
      settings: ["*"]
      devotions_admin: ["*"]
      groups: ["*"]
      beacons: ["*"]
      resources: ["*"]
      serving: ["*"]
      communications: ["*"]
      prayer_requests: ["*"]
      events: ["*"]
      finance: ["*"]
      heartbeat: ["*"]
      passport: ["*"]

  lead_pastor:
    name: "Lead Pastor"
    description: "Lead Pastor with full access to everything"
    permissions:
      users: ["*"]
      campuses: ["*"]
      system: ["*"]
      settings: ["*"]
      devotions_admin: ["*"]
      groups: ["*"]
      beacons: ["*"]
      resources: ["*"]
      serving: ["*"]
      communications: ["*"]
      prayer_requests: ["*"]
      events: ["*"]
      finance: ["*"]
      heartbeat: ["*"]
      passport: ["*"]

  campus_pastor:
    name: "Campus Pastor"
    description: "Campus-specific leadership - Can view/manage their campus data only. No admin settings access."
    permissions:
      # IMPORTANT: Campus pastors should NOT see admin settings pages
      # They should only see "My Profile" in Settings section
      users: []  # NO access to user management
      campuses: []  # NO access to campus management
      system: []  # NO access to system settings
      settings: []  # NO access to settings pages (only My Profile is always visible)
      
      # New resources - campus-scoped (limited to their campus)
      devotions_admin: ["view"]
      groups: ["view", "edit", "create"]  # Access to connect groups for their campus
      beacons: []  # No access
      resources: ["view"]  # Can view team resources
      
      # Existing resources - campus-scoped (limited to their campus)
      serving: ["view", "edit"]
      communications: ["view"]
      prayer_requests: ["view", "edit"]
      events: ["view", "edit"]
      finance: []  # No finance access
      heartbeat: ["view", "edit"]
      passport: ["view"]

  staff:
    name: "Staff Member"
    description: "Basic staff access - Home, Resources, Profile only"
    permissions:
      # Very limited system access
      users: []
      campuses: []
      system: []
      settings: ["view"]  # Only profile
      
      # New resources - view only
      devotions_admin: []
      groups: []
      beacons: []
      resources: ["view"]  # Can view team resources
      
      # Existing resources - minimal access
      serving: []
      communications: []
      prayer_requests: []
      events: []
      finance: []
      heartbeat: []
      passport: ["view_own"]

  finance:
    name: "Finance Team"
    description: "Finance team - Home, Finance Input, Resources, Profile only"
    permissions:
      # No system access
      users: []
      campuses: ["view"]  # Need to view campuses for finance input
      system: []
      settings: ["view"]  # Only profile
      
      # New resources
      devotions_admin: []
      groups: []
      beacons: []
      resources: ["view"]  # Can view team resources
      
      # Existing resources - finance only
      serving: []
      communications: []
      prayer_requests: []
      events: []
      finance: ["view", "edit", "create"]  # Full finance access
      heartbeat: []
      passport: ["view_own"]

  dream_team_leader:
    name: "Dream Team Leader"
    description: "Volunteer team leadership"
    permissions:
      # Very limited access
      users: []
      campuses: ["view"]
      
      # New resources - minimal access
      devotions_admin: ["view"]
      groups: ["view"]
      beacons: []
      resources: ["view"]  # Can view team resources
      
      # Existing resources
      serving: ["view", "edit"]
      communications: []
      prayer_requests: ["view"]
      events: ["view"]
      finance: []
      heartbeat: ["view"]
      passport: ["view"]

  member:
    name: "Church Member"
    description: "Regular church member"
    permissions:
      # No system access
      users: []
      campuses: []
      
      # New resources - self-only access
      devotions_admin: []
      groups: ["view_self_groups"]
      beacons: []
      resources: ["view"]  # Can view team resources
      
      # Existing resources
      serving: ["view_self"]
      communications: []
      prayer_requests: ["view_own", "create"]
      events: ["view"]
      finance: []
      heartbeat: ["view_own"]
      passport: ["view_own", "edit_own"]

  connect_group_leader:
    name: "Connect Group Leader"
    description: "Connect group leader with access to their group and attendance marking"
    permissions:
      # No system access
      users: []
      campuses: ["view"]
      
      # New resources - group leader access
      devotions_admin: []
      groups: ["view_own_groups", "edit_own_groups"]  # Can view and edit their own groups
      beacons: []
      resources: ["view"]  # Can view team resources
      
      # Existing resources
      serving: []
      communications: []
      prayer_requests: []
      events: ["view"]
      finance: []
      heartbeat: ["view_own", "edit_own"]  # Can mark attendance which feeds to heartbeat
      passport: []

# Resource definitions
resources:
  settings:
    name: "System Settings"
    description: "Manage system settings, configuration, and administrative features"
    actions: ["view", "edit", "create", "delete", "manage"]
    
  devotions_admin:
    name: "Devotions Administration"
    description: "Manage devotional plans and content"
    actions: ["view", "edit", "publish", "delete"]
    
  groups:
    name: "Connect Groups"
    description: "Manage connect groups and memberships"
    actions: ["view", "edit", "create", "delete", "view_self_groups", "view_own_groups", "edit_own_groups"]
    
  beacons:
    name: "Beacon Management"
    description: "Manage Bluetooth beacons and zones"
    actions: ["view", "edit", "create", "delete", "assign"]

  resources:
    name: "Team Resources"
    description: "Access team documents, templates, and media files"
    actions: ["view"]

  heartbeat:
    name: "Heartbeat"
    description: "View and manage engagement health dashboards"
    actions: ["view", "edit", "create", "delete", "view_own"]

# Campus scoping rules
campus_scoping:
  enabled: true
  resources:
    - "groups"
    - "devotions_admin"
    - "serving"
    - "events"
    - "prayer_requests"
    - "heartbeat"
  
  # Roles that can see all campuses
  cross_campus_roles:
    - "superadmin"
    - "admin"
    - "senior_leadership"
    - "senior_pastor"
    - "lead_pastor"
    - "finance"

# Region scoping rules
region_scoping:
  enabled: true
  description: "Region-level access control for multi-national expansion"
  
  # Resources that respect region boundaries
  resources:
    - "campuses"
    - "groups"
    - "devotions_admin"
    - "serving"
    - "events"
    - "prayer_requests"
    - "finance"
    - "heartbeat"
  
  # Roles that can see ALL regions (global access)
  global_roles:
    - "superadmin"
    - "admin"
    - "senior_leadership"
    - "senior_pastor"
    - "lead_pastor"
  
  # Region-specific leadership role
  # Users can be assigned: region_id in their user profile to limit to that region
  region_leader:
    name: "Regional Leader"
    description: "Leadership access to all campuses within assigned region"
    permissions:
      users: ["view", "edit"]  # Within region only
      campuses: ["view", "edit"]  # Within region only
      devotions_admin: ["*"]
      groups: ["*"]
      beacons: ["view"]
      serving: ["*"]
      communications: ["*"]
      prayer_requests: ["*"]
      events: ["*"]
      finance: ["view", "export"]
      heartbeat: ["*"]
      passport: ["*"]
